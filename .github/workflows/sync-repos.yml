name: Sync repo list
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sync-repos.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          : > all.json
          for page in 1 2 3 4 5; do
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/users/$OWNER/repos?per_page=100&page=$page&sort=updated" > p.json
            n=$(jq length p.json)
            cat p.json >> all.json
            [ "$n" -lt 100 ] && break
          done
          jq -s 'add' all.json > assets/data/repos.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/repos.json
          git diff --cached --quiet || (git commit -m "Update repo list" && git push)
